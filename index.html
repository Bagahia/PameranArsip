<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuis Pameran Arsip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glow { filter: drop-shadow(0 0 18px rgba(99,102,241,0.6)); }
    .glow-text { text-shadow: 0 0 20px rgba(99,102,241,0.4); }
    .btn-pulse { animation: pulse-ring 1.5s ease-in-out infinite; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(99,102,241,0); }
      100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .slide-up { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .confetti-full { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
    .quiz-no-select { user-select: none; -webkit-user-select: none; }
    .tab-warning { animation: tabWarn 0.5s ease-out; }
    @keyframes tabWarn {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
            accent:  { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- ==================== LANDING VIEW ==================== -->
  <div id="view-landing" class="w-full max-w-lg text-center fade-in">
    <div id="logo-container" class="mb-8 flex flex-wrap justify-center items-center gap-6"></div>
    <h1 class="text-4xl font-extrabold mb-3 glow-text text-white">Kuis Pameran Arsip</h1>
    <p class="text-slate-400 text-lg mb-6">Jawab pertanyaanya dan dapatkan hadiah yang menarik</p>
    <input id="input-name" type="text" placeholder="Masukkan nama Anda..."
      class="w-full px-5 py-4 rounded-xl bg-surface-900 border-2 border-slate-600/40 focus:border-accent-400 focus:outline-none text-white text-lg mb-6 transition-all duration-200" />
    <button id="btn-start"
      onclick="startQuiz()"
      class="bg-accent-500 hover:bg-accent-600 text-white font-semibold py-4 px-10 rounded-2xl text-lg transition-all duration-200 btn-pulse cursor-pointer">
      Mulai Sekarang
    </button>
    <p id="landing-status" class="mt-4 text-slate-500 text-sm hidden"></p>
  </div>

  <!-- ==================== QUIZ VIEW ==================== -->
  <div id="view-quiz" class="w-full max-w-2xl hidden">
    <div id="tab-warning-banner" class="hidden bg-red-500/20 border border-red-500/50 rounded-xl px-4 py-3 mb-4 text-center">
      <p class="text-red-400 text-sm font-semibold">Anda terdeteksi meninggalkan kuis. Pelanggaran tercatat.</p>
    </div>
    <div class="bg-surface-800 rounded-3xl p-6 md:p-8 shadow-2xl slide-up quiz-no-select">
      <div class="flex items-center justify-between mb-6">
        <div id="quiz-logo" class="flex-shrink-0 flex items-center gap-2"></div>
        <span id="progress-text" class="text-sm font-semibold text-accent-400">Soal 1 / 10</span>
        <div class="flex items-center gap-2">
          <span id="timer-text" class="text-sm font-bold text-white">5</span>
          <span class="text-xs font-medium bg-surface-900 text-accent-400 px-3 py-1 rounded-full border border-accent-500/30">Target: 100</span>
        </div>
      </div>
      <div class="w-full bg-surface-900 rounded-full h-2 mb-2">
        <div id="progress-bar" class="bg-accent-500 h-2 rounded-full transition-all duration-500" style="width:10%"></div>
      </div>
      <div class="w-full bg-surface-900 rounded-full h-1.5 mb-8">
        <div id="timer-bar" class="bg-yellow-500 h-1.5 rounded-full transition-all duration-1000 linear" style="width:100%"></div>
      </div>
      <h2 id="question-text" class="text-xl md:text-2xl font-bold text-white mb-8 leading-relaxed"></h2>
      <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>
  </div>

  <!-- ==================== RESULTS VIEW ==================== -->
  <div id="view-results" class="w-full max-w-lg text-center hidden">
    <div id="results-card" class="bg-surface-800 rounded-3xl p-8 md:p-10 shadow-2xl slide-up">
      <div id="results-logo" class="mb-6 flex justify-center items-center gap-3"></div>
      <div id="results-icon" class="mb-6 flex justify-center"></div>
      <p id="results-greeting" class="text-xl font-bold text-white mb-2"></p>
      <h2 id="results-title" class="text-3xl font-extrabold mb-4"></h2>
      <div class="bg-surface-900 rounded-2xl py-6 px-4 mb-8 border border-slate-700/50">
        <p class="text-slate-400 text-sm mb-1">Skor Anda</p>
        <p id="score-display" class="text-5xl font-extrabold text-white"></p>
        <p id="results-meta" class="text-slate-500 text-xs mt-2 leading-relaxed"></p>
      </div>
      <div id="results-submission-status" class="hidden mb-4">
        <p id="submission-status-text" class="text-sm"></p>
      </div>
      <button id="btn-result-action"
        class="bg-accent-500 hover:bg-accent-600 text-white font-semibold py-4 px-10 rounded-2xl text-lg transition-all duration-200 cursor-pointer">
      </button>
    </div>
  </div>

  <!-- ==================== ALREADY ATTEMPTED VIEW ==================== -->
  <div id="view-attempted" class="w-full max-w-lg text-center hidden">
    <div class="bg-surface-800 rounded-3xl p-8 md:p-10 shadow-2xl slide-up">
      <div class="mb-6 flex justify-center">
        <svg class="w-20 h-20 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
      </div>
      <h2 class="text-3xl font-extrabold mb-4 text-yellow-400">Sudah Mengerjakan</h2>
      <p id="attempted-message" class="text-slate-400 text-lg mb-6"></p>
      <div class="bg-surface-900 rounded-2xl py-4 px-4 mb-6 border border-slate-700/50">
        <p class="text-slate-400 text-sm mb-1">Skor Sebelumnya</p>
        <p id="attempted-score" class="text-4xl font-extrabold text-white"></p>
      </div>
      <p class="text-slate-500 text-sm mb-6">Kembali besok untuk mencoba lagi!</p>
      <div class="mb-4">
        <input id="attempted-retry-password" type="password" placeholder="Password admin untuk retry..."
          class="w-full px-4 py-3 rounded-xl bg-surface-900 border-2 border-slate-600/40 focus:border-accent-400 focus:outline-none text-white text-sm transition-all duration-200" />
        <p id="attempted-retry-status" class="text-sm mt-2 hidden"></p>
      </div>
      <button onclick="attemptedRetry()"
        class="w-full bg-accent-500 hover:bg-accent-600 text-white font-semibold py-4 px-6 rounded-2xl text-lg transition-all duration-200 cursor-pointer">
        Coba Lagi (Hubungi Panitia)
      </button>
    </div>
  </div>

  <!-- ==================== ADMIN VIEW ==================== -->
  <div id="view-admin" class="w-full max-w-lg hidden">
    <div class="bg-surface-800 rounded-3xl p-8 md:p-10 shadow-2xl slide-up">
      <h2 class="text-2xl font-extrabold mb-2 text-accent-400">Admin Panel</h2>
      <p class="text-slate-400 text-sm mb-6">Reset percobaan kuis pengguna untuk hari ini.</p>
      <input id="admin-password" type="password" placeholder="Password admin..."
        class="w-full px-4 py-3 rounded-xl bg-surface-900 border-2 border-slate-600/40 focus:border-accent-400 focus:outline-none text-white text-sm mb-4 transition-all duration-200" />
      <input id="admin-target-name" type="text" placeholder="Nama pengguna yang akan direset..."
        class="w-full px-4 py-3 rounded-xl bg-surface-900 border-2 border-slate-600/40 focus:border-accent-400 focus:outline-none text-white text-sm mb-4 transition-all duration-200" />
      <p id="admin-status" class="text-sm mb-4 hidden"></p>
      <div class="flex gap-3">
        <button onclick="adminReset()"
          class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 cursor-pointer">
          Reset Percobaan
        </button>
        <button onclick="resetToLanding()"
          class="flex-1 bg-surface-900 hover:bg-surface-800 text-slate-300 font-semibold py-3 px-6 rounded-xl border border-slate-600/40 transition-all duration-200 cursor-pointer">
          Kembali
        </button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const API_URL = "/.netlify/functions/quiz";

    // ============================================================
    // CACHE CONFIG
    // ============================================================
    const CACHE_KEY = "quiz_questions";
    const CACHE_TTL = 5 * 60 * 1000; // 5 minutes

    // ============================================================
    // STATE
    // ============================================================
    let questions = [];
    let currentIndex = 0;
    let correctAnswers = 0;
    let userName = "";
    let timerInterval = null;
    let timeLeft = 5;
    const QUESTION_TIME = 10; // seconds per question

    // ============================================================
    // SECURITY STATE
    // ============================================================
    let deviceFingerprint = null;
    let quizStartTime = null;
    let quizEndTime = null;
    let questionTimes = []; // ms spent on each question
    let questionStartTime = null;
    let tabSwitchCount = 0;
    let quizActive = false;
    const ATTEMPT_LOCK_KEY = "quiz_attempt_lock";

    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const viewLanding = document.getElementById("view-landing");
    const viewQuiz    = document.getElementById("view-quiz");
    const viewResults = document.getElementById("view-results");
    const viewAttempted = document.getElementById("view-attempted");
    const viewAdmin   = document.getElementById("view-admin");
    const btnStart    = document.getElementById("btn-start");
    const landingStatus = document.getElementById("landing-status");
    const inputName   = document.getElementById("input-name");
    const progressText = document.getElementById("progress-text");
    const progressBar  = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const logoContainer = document.getElementById("logo-container");
    const quizLogo = document.getElementById("quiz-logo");
    const resultsLogo = document.getElementById("results-logo");
    const timerText = document.getElementById("timer-text");
    const timerBar = document.getElementById("timer-bar");
    const tabWarningBanner = document.getElementById("tab-warning-banner");

    // ============================================================
    // DEVICE FINGERPRINT
    // ============================================================
    async function getDeviceFingerprint() {
      const cached = localStorage.getItem("quiz_fingerprint");
      if (cached) {
        deviceFingerprint = cached;
        return cached;
      }
      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        deviceFingerprint = result.visitorId;
        localStorage.setItem("quiz_fingerprint", deviceFingerprint);
      } catch (e) {
        // Fallback: generate a random ID
        deviceFingerprint = "fp_" + Math.random().toString(36).substring(2, 15);
        localStorage.setItem("quiz_fingerprint", deviceFingerprint);
      }
      return deviceFingerprint;
    }

    // ============================================================
    // SPONSOR LOGOS
    // ============================================================
    const MAX_LOGOS = 10;
    const LOGO_EXTENSIONS = ["png", "svg", "jpg", "jpeg", "webp", "gif"];
    let allLogoSrcs = [];

    function loadSponsorLogos() {
      let loaded = 0;
      let checked = 0;

      for (let i = 1; i <= MAX_LOGOS; i++) {
        for (let ext of LOGO_EXTENSIONS) {
          const img = new Image();
          const src = "assets/logo" + i + "." + ext;
          img.dataset.logoNum = i;
          img.dataset.src = src;

          img.onload = function () {
            if (!document.querySelector('[data-logo-id="logo' + this.dataset.logoNum + '"]')) {
              const wrapper = document.createElement("div");
              wrapper.className = "flex-shrink-0";
              wrapper.dataset.logoId = "logo" + this.dataset.logoNum;

              this.className = "h-20 md:h-28 max-w-[140px] w-auto object-contain glow";
              this.alt = "Sponsor " + this.dataset.logoNum;
              wrapper.appendChild(this);
              logoContainer.appendChild(wrapper);

              allLogoSrcs.push(src);
              updateQuizLogos();
            }
            checked++;
            if (checked === MAX_LOGOS * LOGO_EXTENSIONS.length) finishLogoLoad();
          };

          img.onerror = function () {
            checked++;
            if (checked === MAX_LOGOS * LOGO_EXTENSIONS.length) finishLogoLoad();
          };

          img.src = src;
        }
      }

      function finishLogoLoad() {
        const logos = logoContainer.children;
        if (logos.length === 0) {
          logoContainer.innerHTML =
            '<svg class="w-24 h-24 glow" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" style="stop-color:#818cf8"/>' +
            '<stop offset="100%" style="stop-color:#6366f1"/></linearGradient></defs>' +
            '<rect x="10" y="10" width="80" height="80" rx="20" fill="url(#grad)"/>' +
            '<text x="50" y="58" text-anchor="middle" font-size="32" font-weight="bold" fill="white" font-family="Inter,sans-serif">Q</text>' +
            '<circle cx="78" cy="22" r="10" fill="#fbbf24"/>' +
            '<text x="78" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a" font-family="Inter,sans-serif">!</text>' +
            '</svg>';
        }
      }
    }

    function updateQuizLogos() {
      if (allLogoSrcs.length > 0) {
        var html = allLogoSrcs.map(function(src) {
          return '<img src="' + src + '" alt="Sponsor" class="h-6 md:h-8 max-w-[60px] w-auto object-contain" />';
        }).join('');
        quizLogo.innerHTML = html;
        resultsLogo.innerHTML = allLogoSrcs.map(function(src) {
          return '<img src="' + src + '" alt="Sponsor" class="h-8 md:h-10 max-w-[80px] w-auto object-contain" />';
        }).join('');
      }
    }

    loadSponsorLogos();
    getDeviceFingerprint();

    // ============================================================
    // VIEW SWITCHING
    // ============================================================
    function showView(name) {
      viewLanding.classList.add("hidden");
      viewQuiz.classList.add("hidden");
      viewResults.classList.add("hidden");
      viewAttempted.classList.add("hidden");
      viewAdmin.classList.add("hidden");
      const map = { landing: viewLanding, quiz: viewQuiz, results: viewResults, attempted: viewAttempted, admin: viewAdmin };
      map[name].classList.remove("hidden");
    }

    // ============================================================
    // TIMER
    // ============================================================
    function startTimer() {
      clearTimer();
      timeLeft = QUESTION_TIME;
      timerText.textContent = timeLeft;
      timerText.className = "text-sm font-bold text-white";
      timerBar.style.transition = "none";
      timerBar.style.width = "100%";
      void timerBar.offsetWidth;
      timerBar.style.transition = "width " + QUESTION_TIME + "s linear";
      timerBar.style.width = "0%";

      timerInterval = setInterval(function () {
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 2) {
          timerText.className = "text-sm font-bold text-red-400";
        }
        if (timeLeft <= 0) {
          clearTimer();
          handleTimeout();
        }
      }, 1000);
    }

    function clearTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function handleTimeout() {
      const buttons = optionsContainer.querySelectorAll("button");
      buttons.forEach(function (b) { b.disabled = true; });

      timerText.textContent = "0";
      timerBar.style.transition = "none";
      timerBar.style.width = "0%";

      questionText.className = "text-xl md:text-2xl font-bold text-red-400 mb-8 leading-relaxed";
      setTimeout(function () {
        questionText.className = "text-xl md:text-2xl font-bold text-white mb-8 leading-relaxed";
      }, 300);

      // Record time for this question (timed out = QUESTION_TIME * 1000)
      recordQuestionTime(QUESTION_TIME * 1000);

      setTimeout(function () {
        currentIndex++;
        if (currentIndex < questions.length) {
          renderQuestion();
        } else {
          showResults();
        }
      }, 600);
    }

    // ============================================================
    // SECURITY: TAB SWITCH DETECTION
    // ============================================================
    function handleVisibilityChange() {
      if (!quizActive) return;
      if (document.hidden) {
        tabSwitchCount++;
        tabWarningBanner.classList.remove("hidden");
        tabWarningBanner.classList.add("tab-warning");
        setTimeout(function () {
          tabWarningBanner.classList.add("hidden");
          tabWarningBanner.classList.remove("tab-warning");
        }, 3000);
      }
    }

    function handleWindowBlur() {
      if (!quizActive) return;
      tabSwitchCount++;
      tabWarningBanner.classList.remove("hidden");
      tabWarningBanner.classList.add("tab-warning");
      setTimeout(function () {
        tabWarningBanner.classList.add("hidden");
        tabWarningBanner.classList.remove("tab-warning");
      }, 3000);
    }

    document.addEventListener("visibilitychange", handleVisibilityChange);
    window.addEventListener("blur", handleWindowBlur);

    // ============================================================
    // SECURITY: SCREENSHOT PREVENTION
    // ============================================================
    document.addEventListener("contextmenu", function(e) {
      if (quizActive) e.preventDefault();
    });

    document.addEventListener("keydown", function(e) {
      if (!quizActive) return;
      if (e.key === "PrintScreen" ||
          (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "I")) ||
          (e.ctrlKey && e.key === "p") ||
          (e.ctrlKey && e.key === "u") ||
          e.key === "F12") {
        e.preventDefault();
        return false;
      }
    });

    document.getElementById("attempted-retry-password").addEventListener("keydown", function(e) {
      if (e.key === "Enter") attemptedRetry();
    });

    // ============================================================
    // SECURITY: QUESTION TIMING TRACKER
    // ============================================================
    function recordQuestionTime(spentMs) {
      questionTimes.push(spentMs);
    }

    // ============================================================
    // FISHER-YATES SHUFFLE
    // ============================================================
    function shuffleArray(arr) {
      const shuffled = arr.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
      }
      return shuffled;
    }

    // ============================================================
    // CACHE HELPERS
    // ============================================================
    function getCachedQuestions() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const cached = JSON.parse(raw);
        if (Date.now() - cached.ts > CACHE_TTL) {
          localStorage.removeItem(CACHE_KEY);
          return null;
        }
        return cached.data;
      } catch (e) {
        return null;
      }
    }

    function setCachedQuestions(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: data }));
      } catch (e) {
        // localStorage full or disabled — ignore
      }
    }

    // ============================================================
    // SECURITY: CHECK IF USER ALREADY ATTEMPTED TODAY
    // ============================================================
    function hasLocalAttemptLock() {
      try {
        const raw = localStorage.getItem(ATTEMPT_LOCK_KEY);
        if (!raw) return false;
        const lock = JSON.parse(raw);
        return lock.date === getTodayDate();
      } catch (e) {
        return false;
      }
    }

    function setLocalAttemptLock() {
      try {
        localStorage.setItem(ATTEMPT_LOCK_KEY, JSON.stringify({ date: getTodayDate(), ts: Date.now() }));
      } catch (e) {}
    }

    function clearLocalAttemptLock() {
      localStorage.removeItem(ATTEMPT_LOCK_KEY);
    }

    async function checkExistingAttempt(name, fingerprint) {
      // Fast local check first
      const localLocked = hasLocalAttemptLock();

      // Server check (always, even if local locked — admin may have reset)
      try {
        const resp = await fetch(API_URL + "?action=checkAttempt&name=" + encodeURIComponent(name) + "&fingerprint=" + encodeURIComponent(fingerprint));
        const data = await resp.json();
        if (data.attempted) {
          setLocalAttemptLock();
          return data;
        }
        // Server says no attempt — clear local lock (admin may have reset)
        if (localLocked) {
          clearLocalAttemptLock();
        }
        return { attempted: false };
      } catch (e) {
        // If server fails but local locked, block
        if (localLocked) {
          return { attempted: true, lastScore: null, source: "local" };
        }
        return { attempted: false };
      }
    }

    // ============================================================
    // SECURITY: SUBMIT QUIZ TO SERVER
    // ============================================================
    async function submitQuizScore(score, totalQuestions, duration, qTimes, switches) {
      const payload = {
        action: "submitQuiz",
        name: userName,
        fingerprint: deviceFingerprint,
        score: score,
        totalQuestions: totalQuestions,
        duration: duration,
        questionTimes: qTimes,
        tabSwitchCount: switches,
        date: getTodayDate(),
        timestamp: new Date().toISOString()
      };

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        return data;
      } catch (e) {
        return { error: "Submission failed" };
      }
    }

    function getTodayDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    // ============================================================
    // START QUIZ
    // ============================================================
    async function startQuiz() {
      const nameVal = inputName.value.trim();
      if (!nameVal) {
        inputName.classList.add("border-red-500");
        inputName.focus();
        return;
      }
      userName = nameVal;
      inputName.classList.remove("border-red-500");

      btnStart.disabled = true;
      btnStart.textContent = "Memuat Soal...";
      landingStatus.classList.remove("hidden");
      landingStatus.classList.remove("text-red-400");

      // Ensure fingerprint is ready
      if (!deviceFingerprint) {
        await getDeviceFingerprint();
      }

      // Client-side guard: check local lock first
      if (hasLocalAttemptLock()) {
        document.getElementById("attempted-message").textContent = "Anda, " + userName + ", sudah mengerjakan kuis hari ini.";
        document.getElementById("attempted-score").textContent = "Tercatat";
        showView("attempted");
        btnStart.disabled = false;
        btnStart.textContent = "Mulai Sekarang";
        landingStatus.classList.add("hidden");
        return;
      }

      // Check if already attempted today
      landingStatus.textContent = "Mengeksekusi percobaan...";
      const attemptCheck = await checkExistingAttempt(userName, deviceFingerprint);

      if (attemptCheck.attempted) {
        // Show already attempted view
        document.getElementById("attempted-message").textContent = "Anda, " + userName + ", sudah mengerjakan kuis hari ini.";
        const displayScore = attemptCheck.lastScore !== null && attemptCheck.lastScore !== undefined
          ? (attemptCheck.lastScore + " / 100")
          : "Tercatat";
        document.getElementById("attempted-score").textContent = displayScore;
        showView("attempted");
        btnStart.disabled = false;
        btnStart.textContent = "Mulai Sekarang";
        landingStatus.classList.add("hidden");
        return;
      }

      // Try cache first
      const cached = getCachedQuestions();
      if (cached && cached.length > 0) {
        landingStatus.textContent = "Memuat dari cache...";
        questions = shuffleArray(cached).slice(0, 10);
        beginQuiz();
        return;
      }

      // Fetch from API
      landingStatus.textContent = "Menghubungkan ke server...";
      try {
        const resp = await fetch(API_URL);
        const data = await resp.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const allQuestions = data.questions;
        if (!allQuestions || allQuestions.length === 0) {
          throw new Error("No questions available");
        }

        setCachedQuestions(allQuestions);
        questions = shuffleArray(allQuestions).slice(0, 10);
        beginQuiz();
      } catch (err) {
        landingStatus.textContent = "Gagal Memuat. Cek API";
        landingStatus.classList.add("text-red-400");
        btnStart.disabled = false;
        btnStart.textContent = "Mulai Sekarang";
      }
    }

    function beginQuiz() {
      currentIndex = 0;
      correctAnswers = 0;
      questionTimes = [];
      tabSwitchCount = 0;
      quizStartTime = Date.now();
      quizEndTime = null;
      quizActive = true;

      // Lock retake immediately (prevents race condition)
      setLocalAttemptLock();

      showView("quiz");
      renderQuestion();
      btnStart.disabled = false;
      btnStart.textContent = "Mulai Sekarang";
      landingStatus.classList.add("hidden");
    }

    // ============================================================
    // RENDER QUESTION
    // ============================================================
    function renderQuestion() {
      const q = questions[currentIndex];
      progressText.textContent = "Soal " + (currentIndex + 1) + " / " + questions.length;
      progressBar.style.width = ((currentIndex + 1) / questions.length * 100) + "%";
      questionText.textContent = q.question;

      const badges = ["A", "B", "C", "D"];
      optionsContainer.innerHTML = "";

      q.options.forEach(function (opt, idx) {
        const btn = document.createElement("button");
        btn.className = [
          "flex items-center gap-3 w-full text-left px-5 py-4 rounded-xl",
          "bg-surface-900 border-2 border-slate-600/40 hover:border-accent-400",
          "hover:bg-surface-950 transition-all duration-200 cursor-pointer group"
        ].join(" ");
        btn.innerHTML =
          '<span class="flex-shrink-0 w-9 h-9 rounded-lg bg-accent-500/20 text-accent-400 font-bold text-sm flex items-center justify-center group-hover:bg-accent-500 group-hover:text-white transition-all">' +
          badges[idx] + "</span>" +
          '<span class="text-slate-200 font-medium">' + escapeHtml(opt) + "</span>";

        btn.addEventListener("click", function () {
          handleAnswer(idx);
        });

        optionsContainer.appendChild(btn);
      });

      // Re-trigger slide-up animation
      const card = viewQuiz.querySelector("div");
      card.classList.remove("slide-up");
      void card.offsetWidth;
      card.classList.add("slide-up");

      // Record start time for this question
      questionStartTime = Date.now();

      startTimer();
    }

    // ============================================================
    // HANDLE ANSWER
    // ============================================================
    function handleAnswer(selectedIndex) {
      clearTimer();
      const q = questions[currentIndex];
      const buttons = optionsContainer.querySelectorAll("button");

      buttons.forEach(function (b) { b.disabled = true; });

      buttons.forEach(function (b, i) {
        if (i === selectedIndex) {
          if (selectedIndex === q.correctIndex) {
            b.className = b.className.replace("border-slate-600/40", "border-green-500");
            b.className = b.className.replace("bg-surface-900", "bg-green-500/10");
          } else {
            b.className = b.className.replace("border-slate-600/40", "border-red-500");
            b.className = b.className.replace("bg-surface-900", "bg-red-500/10");
          }
        }
      });

      if (selectedIndex === q.correctIndex) {
        correctAnswers++;
      }

      // Record time spent on this question
      if (questionStartTime) {
        recordQuestionTime(Date.now() - questionStartTime);
      }

      setTimeout(function () {
        currentIndex++;
        if (currentIndex < questions.length) {
          renderQuestion();
        } else {
          showResults();
        }
      }, 600);
    }

    // ============================================================
    // SHOW RESULTS
    // ============================================================
    async function showResults() {
      quizActive = false;
      quizEndTime = Date.now();
      const total = questions.length;
      const score = Math.round((correctAnswers / total) * 100);
      const isPerfect = score === 100;
      const totalDuration = quizStartTime ? (quizEndTime - quizStartTime) / 1000 : 0;

      // Format timestamps for display
      const startTimeStr = quizStartTime ? new Date(quizStartTime).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "-";
      const endTimeStr = new Date(quizEndTime).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      const resultsIcon  = document.getElementById("results-icon");
      const resultsTitle = document.getElementById("results-title");
      const resultsGreeting = document.getElementById("results-greeting");
      const scoreDisplay = document.getElementById("score-display");
      const btnAction    = document.getElementById("btn-result-action");
      const resultsMeta  = document.getElementById("results-meta");
      const submissionStatus = document.getElementById("results-submission-status");
      const submissionText = document.getElementById("submission-status-text");

      // Show timing metadata with start/end timestamps
      resultsMeta.textContent = "Mulai: " + startTimeStr + " | Selesai: " + endTimeStr + " | Durasi: " + Math.round(totalDuration) + " detik | Tab switch: " + tabSwitchCount;

      // Submit score to server
      submissionStatus.classList.remove("hidden");
      submissionText.textContent = "Menyimpan skor...";
      submissionText.className = "text-sm text-slate-400";

      const submitResult = await submitQuizScore(score, total, totalDuration, questionTimes, tabSwitchCount);

      if (submitResult.error) {
        submissionText.textContent = "Gagal menyimpan skor ke server.";
        submissionText.className = "text-sm text-red-400";
      } else if (submitResult.flagged) {
        submissionText.textContent = "Skor tersimpan. Aktivitas mencurigakan terdeteksi — skor mungkin tidak valid untuk hadiah.";
        submissionText.className = "text-sm text-yellow-400";
      } else {
        submissionText.textContent = "Skor berhasil disimpan.";
        submissionText.className = "text-sm text-green-400";
      }

      if (isPerfect) {
        resultsGreeting.textContent = "Selamat, " + userName + "!";
        resultsIcon.innerHTML =
          '<svg class="w-20 h-20 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<path d="M12 2l2.09 6.26L21 9.27l-5 4.87L17.18 22 12 18.56 6.82 22 8 14.14l-5-4.87 6.91-1.01L12 2z"/>' +
          '<circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.3"/></svg>';
        resultsTitle.textContent = "Skor Sempurna!";
        resultsTitle.className = "text-3xl font-extrabold mb-4 text-yellow-400";
        scoreDisplay.textContent = "100 / 100";
        scoreDisplay.className = "text-5xl font-extrabold text-yellow-400";
        btnAction.textContent = "Lihat Hasil";
        btnAction.onclick = function() {
          document.getElementById("attempted-message").textContent = "Anda, " + userName + ", sudah mengerjakan kuis hari ini.";
          document.getElementById("attempted-score").textContent = "100 / 100";
          showView("attempted");
        };

        showView("results");
        fireConfetti();
      } else {
        resultsGreeting.textContent = "Semangat, " + userName + "!";
        resultsIcon.innerHTML =
          '<svg class="w-20 h-20 text-accent-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>' +
          '</svg>';
        resultsTitle.textContent = "Skor Tercatat!";
        resultsTitle.className = "text-3xl font-extrabold mb-4 text-accent-400";
        scoreDisplay.textContent = score + " / 100";
        scoreDisplay.className = "text-5xl font-extrabold text-white";
        btnAction.textContent = "Lihat Hasil";
        btnAction.onclick = function() {
          document.getElementById("attempted-message").textContent = "Anda, " + userName + ", sudah mengerjakan kuis hari ini.";
          document.getElementById("attempted-score").textContent = score + " / 100";
          showView("attempted");
        };

        showView("results");
      }
    }

    // ============================================================
    // CONFETTI
    // ============================================================
    function fireConfetti() {
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.7 } });
        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.7 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // ============================================================
    // ADMIN RESET
    // ============================================================
    async function adminReset() {
      const password = document.getElementById("admin-password").value.trim();
      const targetName = document.getElementById("admin-target-name").value.trim();
      const statusEl = document.getElementById("admin-status");

      if (!password || !targetName) {
        statusEl.textContent = "Masukkan password dan nama pengguna.";
        statusEl.className = "text-sm text-red-400 mb-4";
        statusEl.classList.remove("hidden");
        return;
      }

      statusEl.textContent = "Memproses...";
      statusEl.className = "text-sm text-slate-400 mb-4";
      statusEl.classList.remove("hidden");

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "adminReset",
            adminPassword: password,
            name: targetName
          })
        });
        const data = await resp.json();

        if (data.error) {
          statusEl.textContent = "Error: " + data.error;
          statusEl.className = "text-sm text-red-400 mb-4";
        } else {
          statusEl.textContent = "Berhasil! " + data.resetCount + " percobaan direset untuk " + targetName + ".";
          statusEl.className = "text-sm text-green-400 mb-4";
        }
      } catch (e) {
        statusEl.textContent = "Gagal menghubungi server.";
        statusEl.className = "text-sm text-red-400 mb-4";
      }
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetToLanding() {
      clearTimer();
      questions = [];
      currentIndex = 0;
      correctAnswers = 0;
      userName = "";
      questionTimes = [];
      tabSwitchCount = 0;
      quizStartTime = null;
      quizActive = false;
      inputName.value = "";
      showView("landing");
    }

    // ============================================================
    // RETRY WITH PASSWORD (from Already Attempted view)
    // ============================================================
    async function attemptedRetry() {
      const password = document.getElementById("attempted-retry-password").value.trim();
      const statusEl = document.getElementById("attempted-retry-status");

      if (!password) {
        statusEl.textContent = "Masukkan password admin.";
        statusEl.className = "text-sm text-red-400";
        statusEl.classList.remove("hidden");
        return;
      }

      statusEl.textContent = "Memproses...";
      statusEl.className = "text-sm text-slate-400";
      statusEl.classList.remove("hidden");

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "adminReset",
            adminPassword: password,
            name: userName,
            fingerprint: deviceFingerprint
          })
        });
        const data = await resp.json();

        if (data.error) {
          statusEl.textContent = "Password salah. Hubungi panitia.";
          statusEl.className = "text-sm text-red-400";
        } else {
          clearLocalAttemptLock();
          resetToLanding();
        }
      } catch (e) {
        statusEl.textContent = "Gagal menghubungi server.";
        statusEl.className = "text-sm text-red-400";
      }
    }

    async function retryWithPassword() {
      const password = document.getElementById("retry-password").value.trim();
      const statusEl = document.getElementById("retry-status");

      if (!password) {
        statusEl.textContent = "Masukkan password admin.";
        statusEl.className = "text-sm text-red-400 mb-4";
        statusEl.classList.remove("hidden");
        return;
      }

      statusEl.textContent = "Memproses...";
      statusEl.className = "text-sm text-slate-400 mb-4";
      statusEl.classList.remove("hidden");

      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "adminReset",
            adminPassword: password,
            name: userName,
            fingerprint: deviceFingerprint
          })
        });
        const data = await resp.json();

        if (data.error) {
          statusEl.textContent = "Password salah. Hubungi panitia.";
          statusEl.className = "text-sm text-red-400 mb-4";
        } else {
          clearLocalAttemptLock();
          closeRetryModal();
          resetToLanding();
        }
      } catch (e) {
        statusEl.textContent = "Gagal menghubungi server.";
        statusEl.className = "text-sm text-red-400 mb-4";
      }
    }

    // ============================================================
    // ADMIN PAGE ACCESS
    // ============================================================
    (function checkAdminAccess() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("admin") === "true") {
        showView("admin");
      }
    })();

    // ============================================================
    // UTILS
    // ============================================================
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>
